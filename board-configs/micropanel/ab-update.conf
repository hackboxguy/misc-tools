# pi-ab-update board profile for micropanel.
#
# Installed read-only at /usr/lib/pi-ab-update/ab-update.conf and read by the
# engine's updater, selector, commit service and factory reset. Strict
# KEY=value lines only: the engine parses this file, it never sources it.
AB_PRODUCT=micropanel
AB_MANIFEST=/home/pi/micropanel/share/micropanel/image-manifest.env
# The display type is DIP-switch selected at runtime, not an image variant.
AB_VARIANT_KEY=IMAGE_VARIANT
AB_STATE_DIR=/data/micropanel-system
# AB_RUNTIME_DIR is left at the engine default (/run/ab-update): nothing on
# this board reads a historical path, and the OLED menu goes through ab-update.
AB_SLOT_SELECTOR=/usr/local/sbin/ab-slot-selector
AB_BOOT_CONFIG_TEMPLATE=/usr/lib/pi-ab-update/boot-selector-config.base
# Every listed unit must be active with no restarts through the settle window.
# A unit that may legitimately fail on some benches would make every update
# fall back, so only qt-demo-launcher (the display-diagnostics UI) is listed:
# - micropanel.service exits and restarts when there is neither an SSD1306 on
#   i2c-3 nor the USB dongle - which is the Pi 4 + 983 display-diagnostics
#   mode (owner, 2026-09-28: the SSD1306/navigation board exists only in the
#   standalone mode). Follow-up when the standalone mode is on the bench:
#   either the daemon idles instead of exiting without a display, and returns
#   here, or that mode gets its own ab-update.conf through a build variant.
#   It stays in AB_RESET_BEFORE: it reads /data.
# - als-dimmer.service is absent until its behaviour without dimmer hardware
#   is proven.
AB_HEALTH_UNITS=qt-demo-launcher.service
AB_SETTLE_SECONDS=30
# Factory reset. The wipe must complete before anything reads /data - including
# the identity-restore units, which must not restore an identity about to be
# erased.
AB_DATA_MOUNT=/data
AB_APP_ACCOUNT=pi
AB_RESET_BEFORE=micropanel-machine-id.service micropanel-debug-journal.service micropanel-ssh-host-keys.service dip-switch-resolution.service micropanel.service qt-demo-launcher.service als-dimmer.service disp-settings-dual-display-restore.service NetworkManager.service
# The shipped NetworkManager profiles live in the read-only lower root: the
# image seeds them into /data, which the running system bind-mounts over.
# kodi's profile is not listed here: the engine re-seeds top-level files only,
# as root:root 0600, so the data skeleton seeds it (from /media/root-ro on a
# reset) with pi ownership intact.
AB_RESET_SEED=/media/root-ro/etc/NetworkManager/system-connections:NetworkManager/system-connections
