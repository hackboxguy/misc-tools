# MicroPanel Touch production-image foundation for ../../build-image.sh.
#
# This deliberately uses a plain Pi OS Lite base, not the Qt profile inherited
# by the older micropanel board. The fixed source image and digest make the
# input repeatable; package updates remain an explicit later release decision.
BOARD_DESCRIPTION="MicroPanel Touch Pi OS Lite appliance image"

IMAGE_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz"
IMAGE_SHA256="79146135607ffe8acac94e5ff501de6fc49583117de5ad08c45a32c73ae2a027"
BASE_PROFILE=""

DEFAULT_VERSION=00.10
# Match the base hook's manifest entry when no explicit board variant is
# selected, so a PiScreen A/B image and its payload remain compatible.
DEFAULT_PANEL_VARIANT=piscreen

# Keep bench recovery consistent with the established image-builder default.
# Callers may override it with --password=PASS; a key-only release policy is a
# later hardening slice.
DEFAULT_PASSWORD=brb0x
REQUIRE_PASSWORD=0

# The stock Lite image has only about 180 MB free.  SDM runs apt upgrade and
# installs the toolchain in the base stage, so reserve 1 GB before that work.
# The app stage adds its own build headroom below.  Both extensions are retained
# in the authored root filesystem; do not enable first-boot root expansion,
# because the post-image hook appends the fixed persistent data partition after
# root.
EXTEND_SIZE_MB=1024
APPS_EXTEND_SIZE_MB=1280 # gloox (OpenSSL) + jsonrpc-tcp-srv build tree needs headroom
EXPAND_ROOT=0
DATA_PARTITION_MB=512

# Keep the released single-slot layout as the default during the A/B
# transition. Use --layout=ab for the Stage 1 flashable layout; the fixed
# 15,000 MiB artifact fits a nominal 16 GB card and leaves about 2 GiB for
# persistent state after the reserved slots.
AB_LAYOUT=0
AB_IMAGE_SIZE_MB=15000
AB_BOOT_PARTITION_MB=256
AB_ROOT_PARTITION_MB=5120
AB_FACTORY_PARTITION_MB=2048
# The Luckfox CTP image is accepted on Pi 4 only. Pi 5/RP1 needs its own
# panel-overlay acceptance before it is permitted by a future updater.
SLOT_COMPATIBLE_BOARDS="pi4"

# V5-05: one pinned source of truth for the application/release repository.
# The builder resolves --app-ref against it and both hook lists expand it, so a
# repo move is a single edit. MICROPANEL_TOUCH_RELEASE_URL_TEMPLATE is the
# reserved Stage 4 OTA location: it is written into the image now (root-owned,
# unused) so turning OTA on needs no new image contract. @ASSET@ expands to the
# version-less published asset name.
MICROPANEL_TOUCH_APP_REPO="https://github.com/hackboxguy/micropanel-touch.git"
# xmproxy XMPP IoT endpoint (xmproxysrv + sysmgr): see the
# packages/jsonrpc-tcp-srv-hook.sh line in hooks*.txt. Repo and ref are
# literal there because hook-list ${VAR}s come from the builder environment,
# which only exports the micropanel-touch app variables.
MICROPANEL_TOUCH_RELEASE_URL_TEMPLATE="https://github.com/hackboxguy/micropanel-touch/releases/latest/download/@ASSET@"

# pi-ab-update engine profile. The engine itself lives in
# packages/pi-ab-update/ and is shared across boards; everything below is what
# makes this board's image *its* image.
AB_PRODUCT="micropanel-touch"
AB_UPDATE_CONF=ab-update.conf
AB_ASSERTIONS=ab-assertions.sh
AB_MANIFEST_PATH="/opt/micropanel-touch/share/micropanel-touch/image-manifest.env"
AB_LIB_DIR="/usr/lib/micropanel-touch"
AB_APP_ACCOUNT="micropanel-touch"
AB_APP_REVISION_KEY="MICROPANEL_TOUCH_REVISION"
# The existing release key lives here and is backed up; keep it in place
# rather than migrating a key whose public half is already in flashed images.
AB_RELEASE_KEY_DIR="/etc/micropanel-touch/release-signing"
DATA_SKELETON=packages/micropanel-touch-data-skeleton.sh

RUNTIME_DEPS=runtime-deps.txt
BUILD_DEPS=build-deps.txt
# Image diet (2026-08-20). slim-remove.txt carries the reasoning; the ceiling
# is the gate. Measured on 00.39: the stock-Lite-derived rootfs was 1958 MiB
# and trimmed to 764 MiB, which took the update bundle from 1.46 GiB (73% of
# both 2 GiB ceilings) to about 0.30 GiB. 900 MiB leaves room for a base
# feature to grow without a build failure, and fails loudly if a base-image
# bump quietly reinstates something the list used to catch.
IMAGE_SLIM_HOOK=packages/micropanel-touch-slim.sh
SLIM_REMOVE=slim-remove.txt
SLIM_MAX_ROOT_MB=960 # /opt/xmproxy adds roughly 3 MB stripped; measure after the first build
HOOK_LIST=hooks.txt
# The Luckfox ST7796S/GT911 panel shares SPI0 and GPIO claims with PiScreen,
# so it is an explicit image selection rather than a runtime auto-detect.
HOOK_LIST_luckfox_ctp=hooks-luckfox-ctp.txt
POST_IMAGE_HOOK=../../packages/pi-ab-update/ab-finalize-layout.sh
