# MicroPanel Touch production-image foundation for ../../build-image.sh.
#
# This deliberately uses a plain Pi OS Lite base, not the Qt profile inherited
# by the older micropanel board. The fixed source image and digest make the
# input repeatable; package updates remain an explicit later release decision.
BOARD_DESCRIPTION="MicroPanel Touch Pi OS Lite appliance image"

IMAGE_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz"
IMAGE_SHA256="79146135607ffe8acac94e5ff501de6fc49583117de5ad08c45a32c73ae2a027"
BASE_PROFILE=""

DEFAULT_VERSION=00.10

# Keep bench recovery consistent with the established image-builder default.
# Callers may override it with --password=PASS; a key-only release policy is a
# later hardening slice.
DEFAULT_PASSWORD=brb0x
REQUIRE_PASSWORD=0

# The stock Lite image has only about 180 MB free.  SDM runs apt upgrade and
# installs the toolchain in the base stage, so reserve 1 GB before that work.
# The app stage adds its own build headroom below.  Both extensions are retained
# in the authored root filesystem; do not enable first-boot root expansion,
# because the post-image hook appends the fixed persistent data partition after
# root.
EXTEND_SIZE_MB=1024
APPS_EXTEND_SIZE_MB=768
EXPAND_ROOT=0
DATA_PARTITION_MB=512

# Keep the released single-slot layout as the default during the A/B
# transition. Use --layout=ab for the Stage 1 flashable layout; the fixed
# 15,000 MiB artifact fits a nominal 16 GB card and leaves about 2 GiB for
# persistent state after the reserved slots.
AB_LAYOUT=0
AB_IMAGE_SIZE_MB=15000
AB_BOOT_PARTITION_MB=256
AB_ROOT_PARTITION_MB=5120
AB_FACTORY_PARTITION_MB=2048
# The Luckfox CTP image is accepted on Pi 4 only. Pi 5/RP1 needs its own
# panel-overlay acceptance before it is permitted by a future updater.
SLOT_COMPATIBLE_BOARDS="pi4"

RUNTIME_DEPS=runtime-deps.txt
BUILD_DEPS=build-deps.txt
HOOK_LIST=hooks.txt
# The Luckfox ST7796S/GT911 panel shares SPI0 and GPIO claims with PiScreen,
# so it is an explicit image selection rather than a runtime auto-detect.
HOOK_LIST_luckfox_ctp=hooks-luckfox-ctp.txt
POST_IMAGE_HOOK=packages/finalize-image-layout.sh
