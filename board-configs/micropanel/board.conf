# micropanel board configuration for ../../build-image.sh
BOARD_DESCRIPTION="Micropanel display-test system (Qt demo, FPGA tools, disptool, kodi)"

# Vanilla RaspiOS lite image (bookworm, arm64)
IMAGE_URL="https://downloads.raspberrypi.com/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-10-02/2025-10-01-raspios-bookworm-arm64-lite.img.xz"
IMAGE_SHA256=""

# Base stage comes from the shared qt-bookworm profile (base-configs/qt-bookworm):
# apt packages + vsomeip baked into one base image reused by all Qt boards.
# Extend size and password are profile properties.
BASE_PROFILE=qt-bookworm

DEFAULT_VERSION=01.15

# Extra image extension applied at the START of the apps stage (working copy
# only - the shared profile base and kernel caches stay compact). Needed
# because micropanel's hook set (sp6bins/media-files copies + 4 source
# builds) requires ~1.5-2GB scratch, and the profile base + kernel leave
# only ~0.6GB free. Final image grows accordingly (~+1.2GB; keeps the result under 8GB-card capacity).
APPS_EXTEND_SIZE_MB=1200

# Files relative to this directory ("none" to disable).
# RUNTIME_DEPS is re-asserted in the apps stage after the build-dep purge;
# BUILD_DEPS is unused while BASE_PROFILE is set (profile build-deps rule).
RUNTIME_DEPS=runtime-deps.txt
BUILD_DEPS=build-deps.txt
HOOK_LIST=hooks.txt

# Kernel + out-of-tree drivers (hh983-serializer, himax-touch from br-wrapper)
KERNEL=1
# Pinned to a commit, not the rpi-6.12.y tip: 53ee31021 "drm/v3d: Revert to
# downstream" (2026-09-14, and the branch tip at the time of writing) restores
# v3d_gemfs.o to drivers/gpu/drm/v3d/Makefile and the v3d_gemfs_init()/_fini()
# call sites, but does NOT restore v3d_gemfs.c - the file is in no commit on
# the branch.  The tree cannot build from a clean checkout; it only appeared to
# work here while a stale v3d_gemfs.o from an earlier tree state satisfied the
# dependency.  Dropping the Makefile line is not a fix either, since v3d_gem.c
# and v3d_bo.c still call into it.
#
# 08365d253 "drm/v3d: Revert to upstream" is its parent and is consistent:
# Makefile, source and call sites all agree that gemfs is absent.  It is
# 6.12.109, matching the kernel this board already runs.
#
# Do NOT pin this to a stable_* tag.  Those track raspberrypi/linux's current
# default branch, which is now 6.18 - stable_20260911 is 6.12's successor by
# date only, and building it breaks the out-of-tree himax drivers (hrtimer_init()
# was removed after 6.12).  A tag is only safe here if it is on the 6.12 series.
#
# Revisit once rpi-6.12.y is repaired upstream.
KERNEL_BRANCH=08365d253e33524dd7d620cba3616276f5111db3
KERNEL_CONFIG=custom-pi-kernel-builder/configs/config-6.12.47+rpt-rpi-v8
DRIVERS_DIR=br-wrapper/package

# Repos cloned/updated into <workspace>/sources before building.
# Format: name|git-url|branch  (one per line)
# ${REPOBINS} in hooks.txt resolves to the sources dir (or --repobins=DIR).
SOURCES="br-wrapper|https://github.com/hackboxguy/br-wrapper.git|main
sp6bins|https://github.com/hackboxguy/sp6bins.git|main
rh850-flash-tools|https://github.com/hackboxguy/rh850-flash-tools.git|main
archsp6|https://github.com/hackboxguy/space6-architecture.git|master
media-files|https://github.com/hackboxguy/media-files.git|main
qt-cluster-demo|https://github.com/hackboxguy/qt-cluster-demo.git|main"

# --- A/B in-system update (opt-in: --layout=ab; needs a 16 GB card) ---------
# The single-slot 8 GB product above stays the default and builds exactly as
# before: every A/B-only input is a VAR_ab override, which build-image.sh
# applies only with --layout=ab. EXPAND_ROOT is deliberately not set here - it
# is part of the shared qt-bookworm base stamp. An A/B build forces its own apps
# stage to --no-expand-root instead, and the finalizer strips the first-boot
# init= the base leaves in cmdline.txt.
AB_LAYOUT=0
AB_IMAGE_SIZE_MB=15000
# The unpruned boot tree (~90 MiB) does not fit three times into 256 MiB (flat
# copy + A/ + B/). The A/B slim step prunes it; revisit this after measuring the
# pruned tree. Slot sizes freeze at first flash.
AB_BOOT_PARTITION_MB=256
AB_ROOT_PARTITION_MB=5120
AB_FACTORY_PARTITION_MB=2048
# The custom kernel is bcm2711/v8 only.
SLOT_COMPATIBLE_BOARDS="pi4"

# pi-ab-update engine profile (the engine is packages/pi-ab-update/).
AB_PRODUCT="micropanel"
AB_UPDATE_CONF=ab-update.conf
AB_ASSERTIONS=ab-assertions.sh
AB_MANIFEST_PATH="/home/pi/micropanel/share/micropanel/image-manifest.env"
AB_APP_ACCOUNT="pi"
AB_APP_REVISION_KEY="MICROPANEL_REVISION"
# A separate product gets its own release key; back it up before publishing.
AB_RELEASE_KEY_DIR="/etc/micropanel/release-signing"
# @ASSET@ expands to the version-less asset name; --release-url-template
# overrides it per build (bench OTA rehearsals).
AB_RELEASE_URL_TEMPLATE="https://github.com/hackboxguy/micropanel/releases/latest/download/@ASSET@"
# The payload/asset variant. The display type is chosen at runtime by DIP
# switch, so it is not an image variant; the image manifest says IMAGE_VARIANT=base.
# Cluster Demo V2 (hooks of board-configs/qt-cluster-demo, see hooks.txt): the
# CAN proxy as data source, no cluster service (the launcher's cluster-v2 page
# starts the app), the cluster installed and the other two repos pruned to what
# runs, and an operator's override of each env file on /data/cluster (proxy
# plugin and vehicle interface, emulator car, cluster arguments; PERSISTENCE.md).
# build-image.sh forwards these to the hooks and into the apps stamp.
CLUSTER_SOURCE=proxy
CLUSTER_SERVICE=0
CLUSTER_PRUNE=1
CLUSTER_DATA_ENV=1
# The bench emulator's control port: Kodi's web interface (the Stream Deck's
# Slideshow / Default Ref Video / Media Player / Video Loop keys talk JSON-RPC
# to 127.0.0.1:8080) and the pattern generator's remote control own 8080 here.
CLUSTER_EMULATOR_PORT=8090

DEFAULT_PANEL_VARIANT=base
DATA_SKELETON=packages/micropanel-data-skeleton.sh
# A/B-only inputs. runtime-deps-ab.txt is runtime-deps.txt plus what the update
# engine and overlayroot need on the device (a superset; the static test
# enforces that). hooks-ab.txt is hooks.txt plus the appliance conversion hook.
RUNTIME_DEPS_ab=runtime-deps-ab.txt
HOOK_LIST_ab=hooks-ab.txt
POST_IMAGE_HOOK_ab=../../packages/pi-ab-update/ab-finalize-layout.sh
# Image diet, A/B only: stock kernels, stale module trees, docs/locales/apt
# lists, and a boot partition pruned so three copies fit AB_BOOT_PARTITION_MB.
# The ceiling is measured (the slim hook prints its result line).
IMAGE_SLIM_HOOK_ab=packages/micropanel-slim.sh
SLIM_REMOVE_ab=slim-remove.txt
SLIM_MAX_ROOT_MB_ab=3500 # 3014 MiB measured on 01.33 + appliance hook, +15%
