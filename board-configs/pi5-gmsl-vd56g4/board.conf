# pi5-gmsl-vd56g4 - VD56G4 GMSL camera (AD-GMSL716MIPI-EVK / MAX96716A) on a
# Raspberry Pi 5, live to HDMI. Customizes a vanilla Pi OS Lite *trixie* arm64
# image: stays vanilla + only the packages needed for the camera. Pi 5 ONLY
# (the config.txt cam settings - cam1_reg, csi1, GPIO46 - are Pi 5-specific).
#
# Usage:
#   sudo ./build-image.sh --board=pi5-gmsl-vd56g4 --version=01.00 --dry-run
#   sudo ./build-image.sh --board=pi5-gmsl-vd56g4 --version=01.00
#
# The private gmsl-vd56g4 repo (driver + firmware + overlays) is cloned
# host-side (invoking user's git creds) and copied into the chroot; the hook
# DKMS-installs the driver against the image's stock kernel (no custom kernel).

BOARD_DESCRIPTION="VD56G4 GMSL camera (AD-GMSL716 EVK / MAX96716A) -> Pi 5 HDMI, auto-play"

# Vanilla base: Pi OS Lite trixie arm64 (matches the target Pi 5's OS/kernel so
# the DKMS build lands on the right headers).
IMAGE_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz"
IMAGE_SHA256=""

EXTEND_SIZE_MB=1200
DEFAULT_PASSWORD=brb0x
DEFAULT_VERSION=01.00

# No shared base profile - this is a lean single-board base (like media-mux).
# KERNEL=0: no custom kernel cross-build; the driver is an out-of-tree DKMS
# module built in the apps hook against the image's stock kernel-headers.
KERNEL=0

RUNTIME_DEPS=runtime-deps.txt
BUILD_DEPS=build-deps.txt
HOOK_LIST=hooks.txt

# Private repo -> cloned host-side as the invoking user, referenced by the hook
# as file://${REPOBINS}/gmsl-vd56g4 (never an in-chroot clone of a private repo).
SOURCES="gmsl-vd56g4|https://github.com/hackboxguy/gmsl-vd56g4.git|main"
