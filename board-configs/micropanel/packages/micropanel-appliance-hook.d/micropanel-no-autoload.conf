# micropanel A/B image: no alias autoload of the display drivers.
#
# On this image the display type's module options are written to the volatile
# root by micropanel-display-derive.service after the boot partition is
# mounted. udev would otherwise load hh983-serializer (OF match) and the touch
# driver during coldplug, earlier, with the image's default options - and the
# derive unit would then have to reload the serializer, after which the DP
# source does not retrain and the panel stays black. "blacklist" stops only
# alias-based loading: the derive unit's explicit modprobe (and the DIP-switch
# service's) still loads them, once, with the right options.
blacklist hh983_serializer
blacklist himax_mmi
blacklist himax_oled
