# pi-ab-update board profile for MicroPanel Touch.
#
# Installed read-only at /usr/lib/pi-ab-update/ab-update.conf and read by the
# engine's updater, selector and commit service. Strict KEY=value lines only:
# the engine parses this file, it never sources it as shell.
AB_PRODUCT=micropanel-touch
AB_MANIFEST=/opt/micropanel-touch/share/micropanel-touch/image-manifest.env
AB_VARIANT_KEY=PANEL_VARIANT
AB_STATE_DIR=/data/micropanel-touch-system
# Kept at the historical path: the HMI reads the progress and status files from
# it, so the trigger surface and the engine have to agree. A board with no UI
# can use the engine default.
AB_RUNTIME_DIR=/run/micropanel-touch-update
AB_SLOT_SELECTOR=/usr/local/sbin/ab-slot-selector
AB_BOOT_CONFIG_TEMPLATE=/usr/lib/pi-ab-update/boot-selector-config.base
# Every listed unit must be active with no restarts through the settle window.
AB_HEALTH_UNITS=micropanel-touch.service micropanel-touch-privileged.service
# The one genuinely app-specific part of the health predicate: the HMI has to
# have drawn a frame, not merely be running.
AB_HEALTH_HOOK=/usr/lib/micropanel-touch/update-health
AB_SETTLE_SECONDS=30
# Factory reset. The wipe must complete before anything reads /data - including
# the machine-identity service, which restores the durable ID before journald
# is restarted.
AB_DATA_MOUNT=/data
AB_APP_ACCOUNT=micropanel-touch
AB_RESET_BEFORE=micropanel-touch-machine-id.service micropanel-touch.service micropanel-touch-privileged.service
# The shipped NetworkManager profiles live in the read-only lower root: the
# image seeds them into /data, which the running system then bind-mounts over.
AB_RESET_SEED=/media/root-ro/etc/NetworkManager/system-connections:NetworkManager/system-connections
